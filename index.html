<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#007AFF">
<title>تطبيق التوصيل بين المدن · نموذج العميل</title>
<link rel="icon" href="assets/app-icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.app *{box-sizing:border-box}
.app,.app button,.app input{font-family:"thmanyah sans","IBM Plex Sans Arabic",system-ui,sans-serif}
.app button{cursor:pointer;transition:transform .12s ease,background-color .12s ease}
.app button:disabled{cursor:not-allowed}
.app input::placeholder{color:#8A8A8A}
.city-input::placeholder{font-weight:400}
.press:active:not(:disabled){transform:scale(0.97)}
.sec{width:calc(100% + 32px)!important;margin-left:-16px!important;margin-right:-16px!important;border:0!important;border-radius:0!important}
.sec.press:active:not(:disabled){transform:none;background:#F5F5F5!important}
.dark-card.press:active:not(:disabled){background:#2B2420!important}
.dark-card [style*="pointer-events: none"]{pointer-events:none}
.dark-card [style*="pointer-events: none"] button{pointer-events:auto}
.card-hit:active:not(:disabled){transform:none}
/* Tab bar from "Tab Bar - iPhone454.svg": centred glass capsule that hugs its tabs, 62px, 4px inset, active tab = #EDEDED pill. */
.tab-glass{position:absolute;left:50%;transform:translateX(-50%);bottom:20px;z-index:15;height:62px;padding:4px;border-radius:31px;display:flex;background:rgba(248,248,248,0.8);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);box-shadow:0 8px 15px rgba(0,0,0,0.04),0 0 0 0.5px #E8E8E8,inset 1.25px 0 0 rgba(208,208,208,0.55),inset -1.25px 0 0 rgba(208,208,208,0.55)}
.tab-item{flex:0 0 auto;width:88px;height:54px;padding:0;border:0;border-radius:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:background-color .2s ease,color .2s ease}
.tab-item:active{transform:scale(0.95)}
.tab-label{font-size:12px;line-height:16px;white-space:nowrap}
.with-nav [data-navpad]{padding-bottom:104px!important}
/* Onboarding phone: the image carries a drop shadow on one side, so the device body sits 7.6px left of the image centre; shift it back to the exact middle. */
.onb-phone{transform:translate(calc(-50% + 7.6px),0);animation:onbPhoneUp .8s cubic-bezier(.2,.8,.2,1) .15s both}
@keyframes onbPhoneUp{from{transform:translate(calc(-50% + 7.6px),180px);opacity:0}to{transform:translate(calc(-50% + 7.6px),0);opacity:1}}
.switch{position:relative;width:51px;height:31px;padding:0;border:0;border-radius:9999px;flex-shrink:0;transition:background-color .2s ease}
.switch-knob{position:absolute;top:2px;right:2px;width:27px;height:27px;border-radius:9999px;background:#FFFFFF;box-shadow:0 2px 4px rgba(18,18,18,0.2);transition:transform .2s ease}
.app-icon{box-shadow:0 4px 10px rgba(0,0,0,0.25);animation:iconHint 2.4s ease-in-out infinite}
@keyframes iconHint{0%,100%{box-shadow:0 4px 10px rgba(0,0,0,0.25),0 0 0 0 rgba(255,255,255,0.55)}50%{box-shadow:0 4px 10px rgba(0,0,0,0.25),0 0 0 8px rgba(255,255,255,0)}}
/* Rounded corners use a continuous curve (Figma corner smoothing 100%). Pills and circles
   (9999px) keep their true round shape; browsers without corner-shape fall back to plain radius. */
.app [style*="border-radius"]:not([style*="9999px"]){corner-shape:squircle}
.fv:focus-visible{outline:2px solid #007AFF;outline-offset:2px}
.field{transition:border-color .12s ease}
.field:focus-within{border-color:#007AFF!important}
.field.is-error,.field.is-error:focus-within{border-color:#FF4E64!important}
.pay-opt:focus-within{outline:2px solid #007AFF;outline-offset:2px}
.otp-input{caret-color:transparent}
/* No visible scrollbars anywhere (iOS hides them); content still scrolls. */
.app,.app *{scrollbar-width:none;-ms-overflow-style:none}
.app::-webkit-scrollbar,.app *::-webkit-scrollbar{display:none;width:0;height:0}
.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.app *{transition:none!important;animation:none!important}}
a{color:#0062CC}a:hover{color:#0051A8}
</style>
<style>
/* thmanyah sans, the design font (files in /fonts). IBM Plex Sans Arabic stays as the fallback. */
@font-face{font-family:"thmanyah sans";src:url("fonts/thmanyahsans-Light.otf") format("opentype");font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:"thmanyah sans";src:url("fonts/thmanyahsans-Regular.otf") format("opentype");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"thmanyah sans";src:url("fonts/thmanyahsans-Medium.otf") format("opentype");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"thmanyah sans";src:url("fonts/thmanyahsans-Bold.otf") format("opentype");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"thmanyah sans";src:url("fonts/thmanyahsans-Black.otf") format("opentype");font-weight:900;font-style:normal;font-display:swap}
html,body{height:100%}
body{margin:0;background:#E9EDF3;display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{position:relative;width:375px;height:812px;flex-shrink:0;transform-origin:center center}
#device{width:375px;height:812px;overflow:hidden;border-radius:44px;background:#FFFFFF;box-shadow:0 30px 80px rgba(18,18,18,0.18),0 0 0 10px #121212}
body.phone{background:#FFFFFF}
body.phone #device{border-radius:0;box-shadow:none}
</style>
</head>

  <img class="onb-phone" src="assets/onboarding-phone.png" alt="معاينة الصفحة الرئيسية للتطبيق" style="position: absolute; top: 140px; left: 50%; width: 300px; height: 576px; display: block">
  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 32px 32px 0 0; padding: 28px 16px 24px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; box-shadow: 0 -12px 32px rgba(18, 18, 18, 0.12)">
    <h1 style="margin: 0; font-size: 26px; line-height: 38px; font-weight: 700; color: #121212">رحلتك بين المدن<br>أسهل وأوفر</h1>

    <span style="width: 44px; flex-shrink: 0"></span>
  </div>
  <div style="flex: 1; min-height: 0; overflow: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 8px">

        <span style="height: 28px; padding: 0 10px; border-radius: 9999px; background: #F5F5F5; color: #4B4B4B; font-size: 12px; line-height: 18px; font-weight: 500; display: flex; align-items: center; gap: 6px">

          {{tripDuration}}

      <div style="display: flex; gap: 12px">
        <div style="display: flex; flex-direction: column; align-items: center; padding-top: 8px">
          <span style="width: 12px; height: 12px; border-radius: 9999px; border: 2px solid #007AFF"></span>
          <span style="width: 0; flex: 1; border-inline-start: 2px dashed #D0D0D0; margin: 4px 0"></span>
          <span style="width: 12px; height: 12px; border-radius: 9999px; background: #007AFF"></span>

        <div style="flex: 1; display: flex; flex-direction: column; gap: 20px">
          <div style="display: flex; flex-direction: column">
            <span style="font-size: 16px; line-height: 24px; font-weight: 700">{{tripDep}} · {{tripFrom}}</span>
            <span style="font-size: 12px; line-height: 18px; color: #5D5D5D">نقطة التجمع: {{tripPickup}}</span>
          </div>
          <div style="display: flex; flex-direction: column">
            <span style="font-size: 16px; line-height: 24px; font-weight: 700">{{tripArr}} · {{tripTo}}</span>
            <span style="font-size: 12px; line-height: 18px; color: #5D5D5D">الوصول المتوقع · نقطة الوصول: {{tripDropoff}}</span>
          </div>
        </div>
      </div>
      <a href="https://maps.google.com/" target="_blank" rel="noopener" class="fv" style="min-height: 48px; border-radius: 12px; background: #EBF4FF; border: 1px solid #B8D9FF; display: flex; align-items: center; justify-content: center; gap: 8px; color: {{c.action}}; font-size: 14px; line-height: 22px; font-weight: 700; text-decoration: none">

      </a>
    </div>
    <div class="sec" style="background: #FFFFFF; border: 1px solid #E6E6E6; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px">

        </span>

            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="color: #F4B400"><path d="m13.73 3.51 1.76 3.52c.24.49.88.96 1.42 1.05l3.19.53c2.04.34 2.52 1.82 1.05 3.28l-2.48 2.48c-.42.42-.65 1.23-.52 1.81l.71 3.07c.56 2.43-.73 3.37-2.88 2.1l-2.99-1.77c-.54-.32-1.43-.32-1.98 0l-2.99 1.77c-2.14 1.27-3.44.32-2.88-2.1l.71-3.07c.13-.58-.1-1.39-.52-1.81l-2.48-2.48c-1.46-1.46-.99-2.94 1.05-3.28l3.19-.53c.53-.09 1.17-.56 1.41-1.05l1.76-3.52c.96-1.91 2.52-1.91 3.47 0Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>

          </span>
        </div>
      </div>
      <div style="height: 0; border-top: 1px solid #F0F0F0"></div>
      <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 18px; color: #4B4B4B">

      </div>
    </div>
    <div class="sec" style="background: #FFFFFF; border: 1px solid #E6E6E6; border-radius: 12px; padding: 4px 16px; display: flex; flex-direction: column">
      <div style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #F0F0F0">
        <span style="color: #4B4B4B">المقاعد المتبقية</span>
        <span style="font-weight: 700">{{tripSeatsText}}</span>
      </div>
      <div style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #F0F0F0">
        <span style="color: #4B4B4B">الأمتعة المسموحة</span>
        <span style="font-weight: 700">حتى حقيبتين لكل مقعد</span>
      </div>
      <div style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
        <span style="color: #4B4B4B">تفضيلات الرحلة</span>
        <span style="font-weight: 700">{{tripPrefs}}</span>
      </div>
    </div>
    <div class="sec" style="background: #FFFFFF; border: 1px solid #E6E6E6; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
        <h2 style="margin: 0; font-size: 14px; line-height: 22px; font-weight: 700">آراء الركاب</h2>
        <span style="font-size: 12px; line-height: 18px; color: #5D5D5D">{{tripDriverReviews}} تقييم</span>

          <p style="margin: 0; font-size: 12px; line-height: 18px; color: #121212">{{rv.text}}</p>
          <span style="font-size: 12px; line-height: 18px; color: #5D5D5D">{{rv.name}} · {{rv.when}}</span>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="background: #FFFFFF; border-top: 1px solid #E6E6E6; padding: 12px 16px 16px; display: flex; align-items: center; justify-content: space-between; gap: 16px">

      <span style="font-size: 18px; line-height: 28px; font-weight: 700; color: {{c.action}}">{{tripPriceText}}</span>
      <span style="font-size: 12px; line-height: 18px; color: #5D5D5D">للمقعد الواحد</span>
    </div>
    <button type="button" class="press fv" onClick="{{bookNow}}" style="height: 48px; padding: 0 32px; border-radius: 9999px; border: 0; background: {{c.action}}; color: #FFFFFF; font-size: 16px; line-height: 24px; font-weight: 700">احجز الآن</button>
  </div>
</div>
</sc-if>

          <img src="assets/driver-avatar.png" alt="" style="width: 36px; height: 36px; border-radius: 9999px; border: 2px solid #FFFFFF; box-shadow: 0 2px 8px rgba(18, 18, 18, 0.14); object-fit: cover; background: #F5F5F5; display: block; flex-shrink: 0; position: absolute; right: 0; top: 2px">
        </span>
            <div style="display: flex; flex-direction: column; min-width: 0">
              <span style="font-size: 12px; line-height: 18px; font-weight: 500">{{tripDriverName}} · <span style="color: rgba(255, 255, 255, 0.72); font-weight: 400">★ {{tripDriverRating}}</span></span>
              <span style="font-size: 12px; line-height: 18px; color: rgba(255, 255, 255, 0.72); overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{tripCarLine}}</span>
            </div>
          </div>
        </div>
      </div>

    <sc-if value="{{isStep1}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div class="sec" style="background: #FFFFFF; padding: 16px; display: flex; flex-direction: column; gap: 8px">
          <h2 style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 700">عدد المقاعد</h2>
          <div style="display: flex; align-items: center; justify-content: space-between">
            <span style="font-size: 14px; line-height: 22px; color: #4B4B4B">المتاح: {{tripSeatsText}}</span>
            <div style="display: flex; align-items: center; gap: 16px">
              <button type="button" class="press fv" onClick="{{seatsUp}}" disabled="{{seatsMax}}" aria-label="زيادة مقعد" style="width: 44px; height: 44px; padding: 0; border-radius: 9999px; border: 1px solid #D0D0D0; background: #FFFFFF; color: {{seatsUpColor}}; display: flex; align-items: center; justify-content: center">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12h12M12 18V6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
              </button>
              <span aria-live="polite" style="min-width: 24px; text-align: center; font-size: 20px; line-height: 30px; font-weight: 700">{{seats}}</span>
              <button type="button" class="press fv" onClick="{{seatsDown}}" disabled="{{seatsMin}}" aria-label="تقليل مقعد" style="width: 44px; height: 44px; padding: 0; border-radius: 9999px; border: 1px solid #D0D0D0; background: #FFFFFF; color: {{seatsDownColor}}; display: flex; align-items: center; justify-content: center">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
              </button>
            </div>
          </div>
        </div>

        <div class="sec" style="background: #FFFFFF; padding: 16px; display: flex; flex-direction: column; gap: 12px">
          <h2 style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 700">بيانات الركاب</h2>

            <input id="self" type="checkbox" checked="{{selfTravel}}" onChange="{{toggleSelf}}" class="fv" style="width: 20px; height: 20px; margin: 0; accent-color: #007AFF; flex-shrink: 0">
            أنا من ضمن الركاب
          </label>

            <div style="padding-top: 12px; border-top: 1px solid #F0F0F0; display: flex; align-items: center; gap: 12px">
              <span style="width: 40px; height: 40px; border-radius: 9999px; background: #EBF4FF; color: #007AFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0">

              </span>

                <span style="font-size: 14px; line-height: 22px; font-weight: 700">الراكب 1 · {{displayName}}</span>

            </div>

          <div style="padding-top: 12px; border-top: 1px solid #F0F0F0; display: flex; flex-direction: column; gap: 10px">
            <div style="display: flex; align-items: center; gap: 12px">
              <span style="width: 36px; height: 36px; border-radius: 8px; background: #F5F5F5; color: #4B4B4B; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 22h8c4.02 0 4.74-1.61 4.95-3.57l.75-8C21.97 7.99 21.27 6 17 6H7c-4.27 0-4.97 1.99-4.7 4.43l.75 8C3.26 20.39 3.98 22 8 22ZM8 6v-.8C8 3.43 8 2 11.2 2h1.6C16 2 16 3.43 16 5.2V6" stroke="currentColor" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"></path><path d="M14 13v1.02c0 1.09-.01 1.98-2 1.98-1.98 0-2-.88-2-1.97V13c0-1 0-1 1-1h2c1 0 1 0 1 1ZM21.65 11A16.484 16.484 0 0 1 14 14.02M2.62 11.27c2.25 1.54 4.79 2.47 7.38 2.76" stroke="currentColor" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"></path></svg>
              </span>
              <span style="flex: 1; font-size: 14px; line-height: 22px; font-weight: 700">{{b.title}}</span>
              <button type="button" class="press fv" onClick="{{b.remove}}" aria-label="{{b.removeAria}}" style="width: 44px; height: 44px; padding: 0; border-radius: 9999px; border: 0; background: transparent; color: #BF3B4B; display: flex; align-items: center; justify-content: center">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 5.98c-3.33-.33-6.68-.5-10.02-.5-1.98 0-3.96.1-5.94.3L3 5.98M8.5 4.97l.22-1.31C8.88 2.71 9 2 10.69 2h2.62c1.69 0 1.82.75 1.97 1.67l.22 1.3M18.85 9.14l-.65 10.07C18.09 20.78 18 22 15.21 22H8.79C6 22 5.91 20.78 5.8 19.21L5.15 9.14M10.33 16.5h3.33M9.5 12.5h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
              </button>
            </div>
            <div role="group" aria-label="{{b.sizeAria}}" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
              <sc-for list="{{b.sizes}}" as="sz" hint-placeholder-count="3">
                <button type="button" class="press fv" onClick="{{sz.pick}}" aria-pressed="{{sz.pressed}}" style="height: 44px; padding: 0 4px; border-radius: 9999px; border: 1px solid {{sz.border}}; background: {{sz.bg}}; color: {{sz.color}}; font-size: 14px; line-height: 22px; font-weight: {{sz.weight}}">{{sz.label}}</button>
              </sc-for>
            </div>
          </div>
        </sc-for>
        <sc-if value="{{noBags}}" hint-placeholder-val="{{ false }}">
          <p style="margin: 0; padding: 20px 16px; border: 1px dashed #D0D0D0; border-radius: 12px; text-align: center; font-size: 14px; line-height: 22px; color: #4B4B4B">لا توجد حقائب. يمكنك المتابعة بدون أمتعة.</p>
        </sc-if>
        <button type="button" class="press fv" onClick="{{addBag}}" disabled="{{bagsFull}}" style="width: 100%; height: 48px; border-radius: 9999px; border: 1px solid {{addBagBorder}}; background: #FFFFFF; color: {{addBagColor}}; font-size: 14px; line-height: 22px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12h12M12 18V6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          إضافة حقيبة
        </button>
        <sc-if value="{{bagsFull}}" hint-placeholder-val="{{ false }}">
          <p style="margin: 0; font-size: 12px; line-height: 18px; color: #5D5D5D; text-align: center">وصلت للحد الأقصى من الحقائب لعدد المقاعد المختار.</p>
        </sc-if>
      </div>
    </sc-if>

    <!-- step 3: summary -->
    <sc-if value="{{isStep3}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div class="sec" style="background: #FFFFFF; border: 1px solid #E6E6E6; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
            <h2 style="margin: 0; font-size: 14px; line-height: 22px; font-weight: 700">الرحلة</h2>
          </div>
          <span style="font-size: 12px; line-height: 18px; color: #4B4B4B">نقطة التجمع: {{tripPickup}} · {{tripDep}}</span>
          <span style="font-size: 12px; line-height: 18px; color: #4B4B4B">نقطة الوصول: {{tripDropoff}} · {{tripArr}}</span>
          <span style="font-size: 12px; line-height: 18px; color: #4B4B4B">{{tripDriverName}} · {{tripCar}} · <span dir="rtl">{{tripPlate}}</span></span>
        </div>
        <div class="sec" style="background: #FFFFFF; border: 1px solid #E6E6E6; border-radius: 12px; padding: 6px 16px 16px; display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
            <h2 style="margin: 0; font-size: 14px; line-height: 22px; font-weight: 700">الركاب ({{seats}})</h2>
            <button type="button" class="press fv" onClick="{{editStep1}}" style="height: 44px; padding: 0 4px; border: 0; background: transparent; color: {{c.action}}; font-size: 14px; line-height: 22px; font-weight: 700; border-radius: 8px">تعديل</button>
          </div>
          <sc-for list="{{summaryPassengers}}" as="sp" hint-placeholder-count="2">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; line-height: 18px">
              <span style="font-weight: 500">{{sp.name}}</span>
              <span dir="ltr" style="color: #5D5D5D">{{sp.phone}}</span>
            </div>
          </sc-for>
        </div>
        <div class="sec" style="background: #FFFFFF; border: 1px solid #E6E6E6; border-radius: 12px; padding: 6px 16px 16px; display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
            <h2 style="margin: 0; font-size: 14px; line-height: 22px; font-weight: 700">الأمتعة</h2>
            <button type="button" class="press fv" onClick="{{editStep2}}" style="height: 44px; padding: 0 4px; border: 0; background: transparent; color: {{c.action}}; font-size: 14px; line-height: 22px; font-weight: 700; border-radius: 8px">تعديل</button>
          </div>
          <span style="font-size: 12px; line-height: 18px; color: #4B4B4B">{{bagsSummary}}</span>
        </div>
        <div class="sec" style="background: #FFFFFF; border: 1px solid #E6E6E6; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
          <h2 style="margin: 0; font-size: 14px; line-height: 22px; font-weight: 700">تفاصيل المبلغ</h2>
          <div style="display: flex; justify-content: space-between; gap: 8px; font-size: 12px; line-height: 18px; color: #4B4B4B">
            <span>سعر المقعد</span><span>{{tripPriceText}}</span>
          </div>
          <div style="display: flex; justify-content: space-between; gap: 8px; font-size: 12px; line-height: 18px; color: #4B4B4B">
            <span>عدد المقاعد</span><span>{{seats}}</span>
          </div>
          <div style="display: flex; justify-content: space-between; gap: 8px; font-size: 12px; line-height: 18px; color: #4B4B4B">
            <span>رسوم الخدمة</span><span>لا توجد</span>
          </div>
          <div style="height: 0; border-top: 1px solid #F0F0F0"></div>
          <div style="display: flex; justify-content: space-between; gap: 8px; font-size: 16px; line-height: 24px; font-weight: 700">
            <span>الإجمالي</span><span>{{totalText}}</span>
          </div>
        </div>
        <div class="sec" style="background: #FFFFFF; border: 1px solid #E6E6E6; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 14px; line-height: 22px; font-weight: 700">سياسة الإلغاء</span>
          <span style="font-size: 12px; line-height: 18px; color: #4B4B4B">• الإلغاء قبل موعد الرحلة بـ 6 ساعات أو أكثر: استرداد كامل المبلغ.</span>
          <span style="font-size: 12px; line-height: 18px; color: #4B4B4B">• الإلغاء قبل أقل من 6 ساعات: استرداد 80% من المبلغ.</span>
          <span style="font-size: 12px; line-height: 18px; color: #4B4B4B">• لا يمكن الإلغاء من التطبيق بعد بدء الرحلة.</span>
        </div>
      </div>
    </sc-if>
  </div>

  <div style="background: #FFFFFF; border-top: 1px solid #E6E6E6; padding: 12px 16px 16px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
    <div style="display: flex; flex-direction: column">
      <span style="font-size: 12px; line-height: 18px; color: #5D5D5D">الإجمالي</span>
      <span aria-live="polite" style="font-size: 18px; line-height: 28px; font-weight: 700; color: {{c.action}}">{{totalText}}</span>
      <span style="font-size: 12px; line-height: 18px; color: #5D5D5D">{{totalSub}}</span>
    </div>
    <button type="button" class="press fv" onClick="{{bNext}}" disabled="{{loading}}" style="height: 48px; padding: 0 24px; border-radius: 9999px; border: 0; background: {{c.action}}; color: #FFFFFF; font-size: 16px; line-height: 24px; font-weight: 700; display: flex; align-items: center; gap: 8px">
      <sc-if value="{{loading}}" hint-placeholder-val="{{ false }}">
        <svg class="spin" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-opacity="0.35" stroke-width="2"></circle><path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
      </sc-if>
      {{bCta}}
    </button>
  </div>
</div>
</sc-if>

<!-- ============ PAYMENT (CUS-07) ============ -->
<sc-if value="{{isPayment}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; min-height: 0; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #FFFFFF">
    <button type="button" class="press fv" onClick="{{payBack}}" aria-label="رجوع لملخص الحجز" style="width: 44px; height: 44px; padding: 0; margin-right: -10px; border-radius: 9999px; border: 0; background: transparent; color: #121212; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <svg width="24" height="24" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M7.42504 17.225C7.26671 17.225 7.10837 17.1667 6.98337 17.0417C6.74171 16.8 6.74171 16.4 6.98337 16.1583L12.4167 10.725C12.8167 10.325 12.8167 9.67499 12.4167 9.27499L6.98337 3.84165C6.74171 3.59999 6.74171 3.19999 6.98337 2.95832C7.22504 2.71665 7.62504 2.71665 7.86671 2.95832L13.3 8.39165C13.725 8.81665 13.9667 9.39165 13.9667 9.99999C13.9667 10.6083 13.7334 11.1833 13.3 11.6083L7.86671 17.0417C7.74171 17.1583 7.58337 17.225 7.42504 17.225Z" fill="currentColor"></path></svg>

  </div>
  <div style="flex: 1; min-height: 0; overflow: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 8px">

        <div style="display: flex; flex-direction: column; gap: 2px">

<!-- ============ SUPPORT HUB (CUS-14) ============ -->
<sc-if value="{{isSupport}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; min-height: 0; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #FFFFFF">
    <button type="button" class="press fv" onClick="{{supportBack}}" aria-label="رجوع" style="width: 44px; height: 44px; padding: 0; margin-right: -10px; border-radius: 9999px; border: 0; background: transparent; color: #121212; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <svg width="24" height="24" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M7.42504 17.225C7.26671 17.225 7.10837 17.1667 6.98337 17.0417C6.74171 16.8 6.74171 16.4 6.98337 16.1583L12.4167 10.725C12.8167 10.325 12.8167 9.67499 12.4167 9.27499L6.98337 3.84165C6.74171 3.59999 6.74171 3.19999 6.98337 2.95832C7.22504 2.71665 7.62504 2.71665 7.86671 2.95832L13.3 8.39165C13.725 8.81665 13.9667 9.39165 13.9667 9.99999C13.9667 10.6083 13.7334 11.1833 13.3 11.6083L7.86671 17.0417C7.74171 17.1583 7.58337 17.225 7.42504 17.225Z" fill="currentColor"></path></svg>
    </button>
    <h1 style="flex: 1; margin: 0; font-size: 16px; line-height: 24px; font-weight: 700; text-align: center">الدعم الفني والشكاوى</h1>
    <span style="width: 44px; flex-shrink: 0"></span>
  </div>
  <div style="flex: 1; min-height: 0; overflow: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 8px">
    <div class="sec" style="background: #FFFFFF; border: 1px solid #E6E6E6; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; line-height: 24px; font-weight: 700">كيف نقدر نساعدك؟</span>
        <span style="font-size: 12px; line-height: 18px; color: #4B4B4B">أرسل استفساراً، أو شكوى على سائق، أو اعتراضاً على حجز (مثل تسجيل «لم يحضر»)، وتابع حالة طلبك هنا.</span>
      </div>
      <button type="button" class="press fv" onClick="{{newTicket}}" style="height: 48px; border-radius: 9999px; border: 0; background: {{c.action}}; color: #FFFFFF; font-size: 16px; line-height: 24px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12h12M12 18V6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        طلب دعم جديد
      </button>
      <button type="button" class="press fv" onClick="{{openFaq}}" style="height: 44px; border-radius: 9999px; border: 1px solid #D0D0D0; background: #FFFFFF; color: #121212; font-size: 14px; line-height: 22px; font-weight: 700">الأسئلة الشائعة</button>
    </div>
    <h2 style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 700">طلباتي</h2>
    <sc-for list="{{ticketRows}}" as="tk" hint-placeholder-count="2">
      <button type="button" class="press fv sec" onClick="{{tk.open}}" style="width: 100%; text-align: start; background: #FFFFFF; border: 1px solid #E6E6E6; border-radius: 12px; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; color: #121212">
        <span style="width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px">
          <span dir="ltr" style="font-size: 12px; line-height: 18px; color: #5D5D5D">{{tk.ref}}</span>
          <span style="height: 26px; padding: 0 10px; border-radius: 9999px; background: {{tk.statusBg}}; color: {{tk.statusDot}}; font-size: 12px; line-height: 18px; font-weight: 700; display: inline-flex; align-items: center; white-space: nowrap; flex-shrink: 0">{{tk.status}}</span>
        </span>
        <span style="font-size: 14px; line-height: 22px; font-weight: 700">{{tk.subject}}</span>
        <span style="font-size: 12px; line-height: 18px; color: #4B4B4B">{{tk.meta}}</span>
      </button>
    </sc-for>
    <sc-if value="{{noTickets}}" hint-placeholder-val="{{ false }}">
      <p style="margin: 0; padding: 20px 16px; border: 1px dashed #D0D0D0; border-radius: 12px; text-align: center; font-size: 14px; line-height: 22px; color: #4B4B4B">لا توجد طلبات دعم بعد.</p>
    </sc-if>
  </div>
</div>
</sc-if>

<!-- ============ NEW TICKET (CUS-14) ============ -->
<sc-if value="{{isTicketNew}}" hint-placeholder-val="{{ false }}">
<form onSubmit="{{submitTicket}}" novalidate="novalidate" style="flex: 1; min-height: 0; display: flex; flex-direction: column; margin: 0">
  <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #FFFFFF">
    <button type="button" class="press fv" onClick="{{openSupportHub}}" aria-label="رجوع" style="width: 44px; height: 44px; padding: 0; margin-right: -10px; border-radius: 9999px; border: 0; background: transparent; color: #121212; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <svg width="24" height="24" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M7.42504 17.225C7.26671 17.225 7.10837 17.1667 6.98337 17.0417C6.74171 16.8 6.74171 16.4 6.98337 16.1583L12.4167 10.725C12.8167 10.325 12.8167 9.67499 12.4167 9.27499L6.98337 3.84165C6.74171 3.59999 6.74171 3.19999 6.98337 2.95832C7.22504 2.71665 7.62504 2.71665 7.86671 2.95832L13.3 8.39165C13.725 8.81665 13.9667 9.39165 13.9667 9.99999C13.9667 10.6083 13.7334 11.1833 13.3 11.6083L7.86671 17.0417C7.74171 17.1583 7.58337 17.225 7.42504 17.225Z" fill="currentColor"></path></svg>
    </button>
    <h1 style="flex: 1; margin: 0; font-size: 16px; line-height: 24px; font-weight: 700; text-align: center">طلب دعم جديد</h1>
    <span style="width: 44px; flex-shrink: 0"></span>
  </div>
  <div style="flex: 1; min-height: 0; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 20px">
    <div role="radiogroup" aria-labelledby="t-type" style="display: flex; flex-direction: column; gap: 8px">
      <span id="t-type" style="font-size: 14px; line-height: 22px; font-weight: 500">نوع الطلب</span>
      <sc-for list="{{ticketTypes}}" as="tt" hint-placeholder-count="3">
        <button type="button" role="radio" class="press fv" onClick="{{tt.pick}}" aria-checked="{{tt.checked}}" style="width: 100%; min-height: 56px; padding: 8px 16px; border-radius: 12px; border: 1px solid {{tt.border}}; background: {{tt.bg}}; color: #121212; text-align: start; display: flex; align-items: center; gap: 12px">
          <span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 9999px; border: 2px solid {{tt.ring}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <span style="width: 10px; height: 10px; border-radius: 9999px; background: {{tt.dot}}"></span>
          </span>
          <span style="flex: 1; display: flex; flex-direction: column">
            <span style="font-size: 14px; line-height: 22px; font-weight: 700">{{tt.label}}</span>
            <span style="font-size: 12px; line-height: 18px; color: #4B4B4B">{{tt.desc}}</span>
          </span>
        </button>
      </sc-for>
      <sc-if value="{{tErr.type}}" hint-placeholder-val="{{ false }}">
        <p role="alert" style="margin: 0; font-size: 12px; line-height: 18px; font-weight: 500; color: #BF3B4B">اختر نوع الطلب.</p>
      </sc-if>
    </div>

    <sc-if value="{{needsBooking}}" hint-placeholder-val="{{ false }}">
      <div role="radiogroup" aria-labelledby="t-booking" style="display: flex; flex-direction: column; gap: 8px">
        <span id="t-booking" style="font-size: 14px; line-height: 22px; font-weight: 500">الحجز المرتبط</span>
        <div style="max-height: 236px; overflow: auto; display: flex; flex-direction: column; gap: 6px; border: 1px solid {{tBookingBorder}}; border-radius: 12px; padding: 6px; background: #FFFFFF">
          <sc-for list="{{ticketBookingOptions}}" as="o" hint-placeholder-count="3">
            <button type="button" role="radio" class="fv" onClick="{{o.pick}}" aria-checked="{{o.checked}}" style="width: 100%; min-height: 52px; padding: 6px 12px; border: 0; border-radius: 8px; background: {{o.bg}}; color: #121212; text-align: start; display: flex; align-items: center; gap: 10px">
              <span aria-hidden="true" style="width: 18px; height: 18px; border-radius: 9999px; border: 2px solid {{o.ring}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
                <span style="width: 8px; height: 8px; border-radius: 9999px; background: {{o.dot}}"></span>
              </span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
                <span style="font-size: 14px; line-height: 22px; font-weight: 700">{{o.route}}</span>
                <span style="font-size: 12px; line-height: 18px; color: #4B4B4B">{{o.meta}}</span>
              </span>
            </button>
          </sc-for>
        </div>
        <sc-if value="{{tErr.booking}}" hint-placeholder-val="{{ false }}">
          <p role="alert" style="margin: 0; font-size: 12px; line-height: 18px; font-weight: 500; color: #BF3B4B">اختر الحجز المرتبط بالطلب.</p>
        </sc-if>
      </div>
    </sc-if>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <label for="t-subject" style="font-size: 14px; line-height: 22px; font-weight: 500">موضوع الطلب</label>
      <div class="field {{tSubjectClass}}" style="height: 56px; padding: 0 16px; border: 1px solid #E6E6E6; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center">
        <input id="t-subject" type="text" maxlength="80" placeholder="مثال: تسجيل غياب غير صحيح" value="{{tForm.subject}}" onChange="{{onTicketSubject}}" aria-invalid="{{tErr.subject}}" style="flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: transparent; padding: 0; font-size: 14px; line-height: 22px; color: #121212">
      </div>
      <sc-if value="{{tErr.subject}}" hint-placeholder-val="{{ false }}">
        <p role="alert" style="margin: 0; font-size: 12px; line-height: 18px; font-weight: 500; color: #BF3B4B">اكتب موضوعاً مختصراً للطلب.</p>
      </sc-if>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; gap: 8px">
        <label for="t-desc" style="font-size: 14px; line-height: 22px; font-weight: 500">وصف المشكلة</label>
        <span style="font-size: 12px; line-height: 22px; color: #5D5D5D">{{tDescCount}}</span>
      </div>
      <div class="field {{tDescClass}}" style="border: 1px solid #E6E6E6; border-radius: 16px; padding: 12px 16px; background: #FFFFFF">
        <textarea id="t-desc" rows="5" maxlength="1000" placeholder="اشرح ما حدث بالتفصيل: الوقت، والمكان، وما تتوقعه منا." value="{{tForm.desc}}" onChange="{{onTicketDesc}}" aria-invalid="{{tErr.desc}}" style="width: 100%; border: 0; outline: none; resize: none; background: transparent; padding: 0; font-family: inherit; font-size: 14px; line-height: 22px; color: #121212"></textarea>
      </div>
      <sc-if value="{{tErr.desc}}" hint-placeholder-val="{{ false }}">
        <p role="alert" style="margin: 0; font-size: 12px; line-height: 18px; font-weight: 500; color: #BF3B4B">اكتب وصفاً من 20 حرفاً على الأقل حتى نفهم المشكلة.</p>
      </sc-if>
    </div>
    <p style="margin: 0; font-size: 12px; line-height: 18px; color: #5D5D5D">نرد عادةً خلال 24 ساعة، وستصلك الردود هنا وبإشعار.</p>
  </div>
  <div style="padding: 16px; background: #FFFFFF; border-top: 1px solid #E6E6E6">
    <button type="button" onClick="{{submitTicket}}" class="press fv" disabled="{{loading}}" style="width: 100%; height: 56px; border-radius: 9999px; border: 0; background: {{c.action}}; color: #FFFFFF; font-size: 16px; line-height: 24px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
      <sc-if value="{{loading}}" hint-placeholder-val="{{ false }}">
        <svg class="spin" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-opacity="0.35" stroke-width="2"></circle><path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
      </sc-if>
      {{ticketBtnLabel}}
    </button>
  </div>
</form>
</sc-if>

<!-- ============ TICKET DETAIL (CUS-14) ============ -->
<sc-if value="{{isTicket}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; min-height: 0; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #FFFFFF">
    <button type="button" class="press fv" onClick="{{openSupportHub}}" aria-label="رجوع" style="width: 44px; height: 44px; padding: 0; margin-right: -10px; border-radius: 9999px; border: 0; background: transparent; color: #121212; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <svg width="24" height="24" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M7.42504 17.225C7.26671 17.225 7.10837 17.1667 6.98337 17.0417C6.74171 16.8 6.74171 16.4 6.98337 16.1583L12.4167 10.725C12.8167 10.325 12.8167 9.67499 12.4167 9.27499L6.98337 3.84165C6.74171 3.59999 6.74171 3.19999 6.98337 2.95832C7.22504 2.71665 7.62504 2.71665 7.86671 2.95832L13.3 8.39165C13.725 8.81665 13.9667 9.39165 13.9667 9.99999C13.9667 10.6083 13.7334 11.1833 13.3 11.6083L7.86671 17.0417C7.74171 17.1583 7.58337 17.225 7.42504 17.225Z" fill="currentColor"></path></svg>
    </button>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; text-align: center">
      <h1 style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 700">تفاصيل الطلب</h1>
      <span dir="ltr" style="font-size: 12px; line-height: 18px; color: #5D5D5D">{{tx.ref}}</span>
    </div>
    <span style="width: 44px; flex-shrink: 0"></span>
  </div>
  <div style="flex: 1; min-height: 0; overflow: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 8px">
    <div class="sec" style="background: #FFFFFF; border: 1px solid #E6E6E6; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
        <h2 style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 700; min-width: 0">{{tx.subject}}</h2>
        <span style="height: 26px; padding: 0 10px; border-radius: 9999px; background: {{tx.statusBg}}; color: {{tx.statusDot}}; font-size: 12px; line-height: 18px; font-weight: 700; display: inline-flex; align-items: center; white-space: nowrap; flex-shrink: 0">{{tx.status}}</span>
      </div>
      <span style="font-size: 12px; line-height: 18px; color: #4B4B4B">{{tx.meta}}</span>
      <ol aria-label="مراحل الطلب" style="margin: 0; padding: 10px 0 0; border-top: 1px solid #F0F0F0; list-style: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{tx.steps}}" as="st" hint-placeholder-count="4">
          <li aria-current="{{st.current}}" style="display: flex; flex-direction: column; gap: 6px">
            <span style="height: 4px; border-radius: 9999px; background: {{st.bar}}"></span>
            <span style="font-size: 12px; line-height: 18px; font-weight: {{st.weight}}; color: {{st.color}}">{{st.label}}</span>
          </li>
        </sc-for>
      </ol>
      <sc-if value="{{tx.hasBooking}}" hint-placeholder-val="{{ false }}">
        <button type="button" class="press fv" onClick="{{openTicketBooking}}" style="height: 44px; border-radius: 9999px; border: 1px solid #D0D0D0; background: #FFFFFF; color: #121212; font-size: 14px; line-height: 22px; font-weight: 700">عرض الحجز <span dir="ltr">{{tx.bookingRef}}</span></button>
      </sc-if>
    </div>
    <h2 style="margin: 4px 0 0; font-size: 14px; line-height: 22px; font-weight: 700; color: #4B4B4B">المراسلات</h2>
    <sc-for list="{{tx.thread}}" as="m" hint-placeholder-count="2">
      <div style="background: {{m.bg}}; border: 1px solid {{m.border}}; border-radius: 12px; padding: 12px 16px; display: flex; flex-direction: column; gap: 4px">
        <span style="display: flex; justify-content: space-between; gap: 8px; font-size: 12px; line-height: 18px">
          <span style="font-weight: 700; color: #121212">{{m.who}}</span>
          <span style="color: #5D5D5D">{{m.time}}</span>
        </span>
        <span style="font-size: 14px; line-height: 22px; color: #121212; white-space: pre-wrap">{{m.text}}</span>
      </div>
    </sc-for>
    <p style="margin: 0; font-size: 12px; line-height: 18px; color: #5D5D5D; text-align: center">{{tx.footer}}</p>
  </div>
</div>
</sc-if>

<!-- ============ FAQ (CUS-14 static page) ============ -->
<sc-if value="{{isFaq}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; min-height: 0; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #FFFFFF">
    <button type="button" class="press fv" onClick="{{faqBack}}" aria-label="رجوع" style="width: 44px; height: 44px; padding: 0; margin-right: -10px; border-radius: 9999px; border: 0; background: transparent; color: #121212; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <svg width="24" height="24" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M7.42504 17.225C7.26671 17.225 7.10837 17.1667 6.98337 17.0417C6.74171 16.8 6.74171 16.4 6.98337 16.1583L12.4167 10.725C12.8167 10.325 12.8167 9.67499 12.4167 9.27499L6.98337 3.84165C6.74171 3.59999 6.74171 3.19999 6.98337 2.95832C7.22504 2.71665 7.62504 2.71665 7.86671 2.95832L13.3 8.39165C13.725 8.81665 13.9667 9.39165 13.9667 9.99999C13.9667 10.6083 13.7334 11.1833 13.3 11.6083L7.86671 17.0417C7.74171 17.1583 7.58337 17.225 7.42504 17.225Z" fill="currentColor"></path></svg>
    </button>
    <h1 style="flex: 1; margin: 0; font-size: 16px; line-height: 24px; font-weight: 700; text-align: center">الأسئلة الشائعة</h1>
    <span style="width: 44px; flex-shrink: 0"></span>
  </div>
  <div style="flex: 1; min-height: 0; overflow: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{faqItems}}" as="f" hint-placeholder-count="5">
      <div class="sec" style="background: #FFFFFF; overflow: hidden">
        <button type="button" class="fv" onClick="{{f.toggle}}" aria-expanded="{{f.expanded}}" aria-controls="{{f.id}}" style="width: 100%; min-height: 56px; padding: 8px 16px; border: 0; background: transparent; color: #121212; font-size: 14px; line-height: 22px; font-weight: 700; display: flex; align-items: center; gap: 12px; text-align: start">
          <span style="flex: 1">{{f.q}}</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="color: #4B4B4B; flex-shrink: 0; transform: {{f.rotate}}"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" stroke-width="1.5" d="M19.92 8.95l-6.52 6.52c-.77.77-2.03.77-2.8 0L4.08 8.95"></path></svg>
        </button>
        <sc-if value="{{f.open}}" hint-placeholder-val="{{ false }}">
          <p id="{{f.id}}" style="margin: 0; padding: 0 16px 14px; font-size: 14px; line-height: 22px; color: #4B4B4B">{{f.a}}</p>
        </sc-if>
      </div>
    </sc-for>
    <div style="margin-top: 8px; background: #EBF4FF; border: 1px solid #B8D9FF; border-radius: 12px; padding: 12px 16px; display: flex; align-items: center; gap: 12px">
      <span style="flex: 1; font-size: 14px; line-height: 22px; font-weight: 700">لم تجد إجابتك؟</span>
      <button type="button" class="press fv" onClick="{{openSupportFromFaq}}" style="height: 40px; padding: 0 16px; border-radius: 9999px; border: 0; background: {{c.action}}; color: #FFFFFF; font-size: 14px; line-height: 22px; font-weight: 700; flex-shrink: 0">تواصل مع الدعم</button>
    </div>
  </div>
</div>
</sc-if>

<!-- ============ BOTTOM NAV ============ -->
<sc-if value="{{showNav}}" hint-placeholder-val="{{ true }}">
<nav aria-label="التنقل الرئيسي" class="tab-glass">
  <button type="button" class="fv tab-item" onClick="{{tabHome}}" aria-current="{{nav.homeCurrent}}" aria-label="الرئيسية" style="background: {{nav.homeBg}}; color: {{nav.homeIcon}}">
    <span style="position: relative; display: flex">
      <sc-if value="{{nav.homeOn}}" hint-placeholder-val="{{ true }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="color: {{nav.homeIcon}}; flex-shrink: 0"><path d="m20.04 6.822-5.76-4.03c-1.57-1.1-3.98-1.04-5.49.13l-5.01 3.91c-1 .78-1.79 2.38-1.79 3.64v6.9c0 2.55 2.07 4.63 4.62 4.63h10.78c2.55 0 4.62-2.07 4.62-4.62v-6.78c0-1.35-.87-3.01-1.97-3.78Zm-7.29 11.18c0 .41-.34.75-.75.75s-.75-.34-.75-.75v-3c0-.41.34-.75.75-.75s.75.34.75.75v3Z" fill="currentColor"></path></svg></sc-if>

      <sc-if value="{{nav.bookingsOff}}" hint-placeholder-val="{{ true }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="color: {{nav.bookingsIcon}}; flex-shrink: 0"><path d="M19.5 12.5A2.5 2.5 0 0 1 22 10V9c0-4-1-5-5-5H7C3 4 2 5 2 9v.5a2.5 2.5 0 0 1 0 5v.5c0 4 1 5 5 5h10c4 0 5-1 5-5a2.5 2.5 0 0 1-2.5-2.5Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M10 4v16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"></path></svg></sc-if>

  <button type="button" class="fv tab-item" onClick="{{tabAccount}}" aria-current="{{nav.accountCurrent}}" aria-label="حسابي" style="background: {{nav.accountBg}}; color: {{nav.accountIcon}}">

      <sc-if value="{{nav.accountOn}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="color: {{nav.accountIcon}}; flex-shrink: 0"><path d="M12 2C9.38 2 7.25 4.13 7.25 6.75c0 2.57 2.01 4.65 4.63 4.74.08-.01.16-.01.22 0h.07a4.738 4.738 0 0 0 4.58-4.74C16.75 4.13 14.62 2 12 2ZM17.08 14.149c-2.79-1.86-7.34-1.86-10.15 0-1.27.85-1.97 2-1.97 3.23s.7 2.37 1.96 3.21c1.4.94 3.24 1.41 5.08 1.41 1.84 0 3.68-.47 5.08-1.41 1.26-.85 1.96-1.99 1.96-3.23-.01-1.23-.7-2.37-1.96-3.21Z" fill="currentColor"></path></svg></sc-if>
      <sc-if value="{{nav.accountOff}}" hint-placeholder-val="{{ true }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="color: {{nav.accountIcon}}; flex-shrink: 0"><path d="M12.16 10.87c-.1-.01-.22-.01-.33 0a4.42 4.42 0 0 1-4.27-4.43C7.56 3.99 9.54 2 12 2a4.435 4.435 0 0 1 .16 8.87ZM7.16 14.56c-2.42 1.62-2.42 4.26 0 5.87 2.75 1.84 7.26 1.84 10.01 0 2.42-1.62 2.42-4.26 0-5.87-2.74-1.83-7.25-1.83-10.01 0Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if>

<!-- ============ SHEETS ============ -->
<sc-if value="{{showSheet}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; z-index: 20; background: rgba(18, 18, 18, 0.45); display: flex; flex-direction: column; justify-content: flex-end">
  <div role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 8px 16px 20px; display: flex; flex-direction: column; gap: 16px; max-height: 660px">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 9999px; background: #D0D0D0"></span>

    <sc-if value="{{isGateSheet}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 16px; padding-top: 8px; text-align: center">
        <span style="width: 72px; height: 72px; border-radius: 9999px; background: #EBF4FF; color: #007AFF; display: flex; align-items: center; justify-content: center">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10ZM20.59 22c0-3.87-3.85-7-8.59-7s-8.59 3.13-8.59 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </span>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <h2 id="sheet-title" style="margin: 0; font-size: 18px; line-height: 28px; font-weight: 700">{{gateTitle}}</h2>
          <p style="margin: 0; font-size: 14px; line-height: 22px; color: #4B4B4B">نحتاج رقم جوالك فقط، بدون كلمة مرور.</p>
        </div>
        <div style="width: 100%; display: flex; flex-direction: column; gap: 8px">
          <button type="button" class="press fv" onClick="{{gateContinue}}" style="width: 100%; height: 56px; border-radius: 9999px; border: 0; background: {{c.action}}; color: #FFFFFF; font-size: 16px; line-height: 24px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21.97 18.33c0 .36-.08.73-.25 1.09-.17.36-.39.7-.68 1.02-.49.54-1.03.93-1.64 1.18-.6.25-1.25.38-1.95.38-1.02 0-2.11-.24-3.26-.73s-2.3-1.15-3.44-1.98a28.75 28.75 0 0 1-3.28-2.8 28.414 28.414 0 0 1-2.79-3.27c-.82-1.14-1.48-2.28-1.96-3.41C2.24 8.67 2 7.58 2 6.54c0-.68.12-1.33.36-1.93.24-.61.62-1.17 1.15-1.67C4.15 2.31 4.85 2 5.59 2c.28 0 .56.06.81.18.26.12.49.3.67.56l2.32 3.27c.18.25.31.48.4.7.09.21.14.42.14.61 0 .24-.07.48-.21.71-.13.23-.32.47-.56.71l-.76.79c-.11.11-.16.24-.16.4 0 .08.01.15.03.23.03.08.06.14.08.2.18.33.49.76.93 1.28.45.52.93 1.05 1.45 1.58.54.53 1.06 1.02 1.59 1.47.52.44.95.74 1.29.92.05.02.11.05.18.08.08.03.16.04.25.04.17 0 .3-.06.41-.17l.76-.75c.25-.25.49-.44.72-.56.23-.14.46-.21.71-.21.19 0 .39.04.61.13.22.09.45.22.7.39l3.31 2.35c.26.18.44.39.55.64.1.25.16.5.16.78Z" stroke="currentColor" stroke-width="1.5" stroke-miterlimit="10"></path></svg>
            المتابعة برقم الجوال
          </button>
          <button type="button" class="press fv" onClick="{{closeSheet}}" style="width: 100%; height: 48px; border: 0; background: transparent; color: {{c.action}}; font-size: 16px; line-height: 24px; font-weight: 700; border-radius: 9999px">ليس الآن</button>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{isDateSheet}}" hint-placeholder-val="{{ false }}">
      <form onSubmit="{{submitSearch}}" novalidate="novalidate" style="margin: 0; display: flex; flex-direction: column; gap: 16px; min-height: 0">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
          <div style="display: flex; flex-direction: column; min-width: 0">
            <h2 id="sheet-title" style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 700">موعد الرحلة</h2>
            <span style="font-size: 12px; line-height: 18px; color: #5D5D5D">{{routeSummary}}</span>
          </div>
          <button type="button" class="press fv" onClick="{{closeSheet}}" aria-label="إغلاق" style="width: 44px; height: 44px; padding: 0; border-radius: 9999px; border: 0; background: transparent; color: #4B4B4B; display: flex; align-items: center; justify-content: center">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 22c5.5 0 10-4.5 10-10S17.5 2 12 2 2 6.5 2 12s4.5 10 10 10ZM9.17 14.83l5.66-5.66M14.83 14.83 9.17 9.17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </button>
        </div>
        <div style="overflow: auto; min-height: 0; display: flex; flex-direction: column; gap: 16px">
          <div role="group" aria-labelledby="date-lbl" style="display: flex; flex-direction: column; gap: 8px">
            <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
              <span id="date-lbl" style="font-size: 14px; line-height: 22px; font-weight: 500">تاريخ الرحلة</span>
              <span style="font-size: 12px; line-height: 18px; color: #5D5D5D">{{dateFull}}</span>
            </div>
            <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
            <sc-for list="{{dateOptions}}" as="d" hint-placeholder-count="14">
              <button type="button" class="press fv" onClick="{{d.pick}}" aria-pressed="{{d.pressed}}" aria-label="{{d.aria}}" style="height: 76px; padding: 10px 4px; border-radius: 16px; border: 1px solid {{d.border}}; background: {{d.bg}}; color: {{d.color}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0">
                <span style="font-size: 12px; line-height: 16px; font-weight: 500">{{d.dayName}}</span>
                <span style="font-size: 18px; line-height: 24px; font-weight: 700">{{d.num}}</span>
                <span style="font-size: 12px; line-height: 16px">{{d.month}}</span>
              </button>
            </sc-for>
            </div>
          </div>
          <div role="group" aria-labelledby="time-lbl" style="display: flex; flex-direction: column; gap: 8px">
            <span id="time-lbl" style="font-size: 14px; line-height: 22px; font-weight: 500">وقت الانطلاق المفضل <span style="font-weight: 400; color: #5D5D5D">(اختياري)</span></span>
            <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
              <sc-for list="{{timeChips}}" as="chip" hint-placeholder-count="4">
                <button type="button" class="press fv" onClick="{{chip.pick}}" aria-pressed="{{chip.pressed}}" style="height: 44px; padding: 0 4px; border-radius: 9999px; border: 1px solid {{chip.border}}; background: {{chip.bg}}; color: {{chip.color}}; font-size: 14px; line-height: 22px; font-weight: {{chip.weight}}">{{chip.label}}</button>
              </sc-for>
            </div>
          </div>
        </div>
        <button type="button" onClick="{{submitSearch}}" class="press fv" style="width: 100%; height: 56px; border-radius: 9999px; border: 0; background: {{c.action}}; color: #FFFFFF; font-size: 16px; line-height: 24px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; flex-shrink: 0">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M11.5 21a9.5 9.5 0 1 0 0-19 9.5 9.5 0 0 0 0 19ZM22 22l-2-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          عرض الرحلات
        </button>
      </form>
    </sc-if>

    <sc-if value="{{isFilterSheet}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
          <h2 id="sheet-title" style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 700">تصفية النتائج</h2>
          <button type="button" class="press fv" onClick="{{closeSheet}}" aria-label="إغلاق" style="width: 44px; height: 44px; padding: 0; border-radius: 9999px; border: 0; background: transparent; color: #4B4B4B; display: flex; align-items: center; justify-content: center">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 22c5.5 0 10-4.5 10-10S17.5 2 12 2 2 6.5 2 12s4.5 10 10 10ZM9.17 14.83l5.66-5.66M14.83 14.83 9.17 9.17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </button>
        </div>
        <div role="group" aria-labelledby="f-time" style="display: flex; flex-direction: column; gap: 8px">
          <span id="f-time" style="font-size: 14px; line-height: 22px; font-weight: 500">وقت الانطلاق</span>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
            <sc-for list="{{fTimeChips}}" as="chip" hint-placeholder-count="3">
              <button type="button" class="press fv" onClick="{{chip.pick}}" aria-pressed="{{chip.pressed}}" style="height: 44px; padding: 0 4px; border-radius: 9999px; border: 1px solid {{chip.border}}; background: {{chip.bg}}; color: {{chip.color}}; font-size: 14px; line-height: 22px; font-weight: {{chip.weight}}">{{chip.label}}</button>
            </sc-for>
          </div>
        </div>
        <div role="group" aria-labelledby="f-price" style="display: flex; flex-direction: column; gap: 8px">
          <span id="f-price" style="font-size: 14px; line-height: 22px; font-weight: 500">سعر المقعد</span>
          <div style="display: flex; gap: 8px; flex-wrap: wrap">
            <sc-for list="{{fPriceChips}}" as="chip" hint-placeholder-count="3">
              <button type="button" class="press fv" onClick="{{chip.pick}}" aria-pressed="{{chip.pressed}}" style="height: 44px; padding: 0 16px; border-radius: 9999px; border: 1px solid {{chip.border}}; background: {{chip.bg}}; color: {{chip.color}}; font-size: 14px; line-height: 22px; font-weight: {{chip.weight}}">{{chip.label}}</button>
            </sc-for>
          </div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding-top: 4px">
          <button type="button" class="press fv" onClick="{{clearDraft}}" style="height: 56px; border-radius: 9999px; border: 1px solid {{c.action}}; background: #FFFFFF; color: {{c.action}}; font-size: 16px; line-height: 24px; font-weight: 700">مسح</button>
          <button type="button" class="press fv" onClick="{{applyFilter}}" style="height: 56px; border-radius: 9999px; border: 0; background: {{c.action}}; color: #FFFFFF; font-size: 16px; line-height: 24px; font-weight: 700">{{applyLabel}}</button>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{isReportSheet}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
          <span style="width: 64px; height: 64px; border-radius: 9999px; background: #FFF7E6; color: #121212; display: flex; align-items: center; justify-content: center">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 7.75V13M21.08 8.58v6.84c0 1.12-.6 2.16-1.57 2.73l-5.94 3.43c-.97.56-2.17.56-3.15 0l-5.94-3.43a3.15 3.15 0 0 1-1.57-2.73V8.58c0-1.12.6-2.16 1.57-2.73l5.94-3.43c.97-.56 2.17-.56 3.15 0l5.94 3.43c.97.57 1.57 1.6 1.57 2.73Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M12 16.2v.1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </span>
          <h2 id="sheet-title" style="margin: 0; font-size: 18px; line-height: 28px; font-weight: 700">الإبلاغ عن عدم حضور السائق</h2>
          <p style="margin: 0; font-size: 14px; line-height: 22px; color: #4B4B4B">{{d.reportIntro}}</p>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="report-note" style="font-size: 14px; line-height: 22px; font-weight: 500">تفاصيل إضافية <span style="font-weight: 400; color: #5D5D5D">(اختياري)</span></label>
          <div class="field" style="border: 1px solid #E6E6E6; border-radius: 16px; padding: 12px 16px; background: #FFFFFF">
            <textarea id="report-note" rows="3" maxlength="300" placeholder="مثال: انتظرت في نقطة التجمع ولم يصل السائق ولم يرد على المحادثة" value="{{reportNote}}" onChange="{{onReportNote}}" style="width: 100%; border: 0; outline: none; resize: none; background: transparent; padding: 0; font-family: inherit; font-size: 14px; line-height: 22px; color: #121212"></textarea>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <button type="button" class="press fv" onClick="{{submitReport}}" style="width: 100%; height: 56px; border-radius: 9999px; border: 0; background: {{c.action}}; color: #FFFFFF; font-size: 16px; line-height: 24px; font-weight: 700">إرسال البلاغ</button>
          <button type="button" class="press fv" onClick="{{closeSheet}}" style="width: 100%; height: 48px; border: 0; background: transparent; color: {{c.action}}; font-size: 16px; line-height: 24px; font-weight: 700; border-radius: 9999px">ليس الآن</button>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{isRateSheet}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
          <img src="assets/driver-avatar.png" alt="" style="width: 64px; height: 64px; border-radius: 9999px; border: 3px solid #FFFFFF; box-shadow: 0 2px 8px rgba(18, 18, 18, 0.14); object-fit: cover; background: #F5F5F5; display: block">
          <h2 id="sheet-title" style="margin: 0; font-size: 18px; line-height: 28px; font-weight: 700">كيف كانت رحلتك مع {{d.driverName}}؟</h2>
          <span style="font-size: 12px; line-height: 18px; color: #4B4B4B">{{d.from}} ← {{d.to}} · {{d.date}}</span>
        </div>
        <div role="radiogroup" aria-label="التقييم من 1 إلى 5" style="display: flex; flex-direction: column; align-items: center; gap: 4px">
          <div style="display: flex; gap: 4px">
            <sc-for list="{{rateStarBtns}}" as="sb" hint-placeholder-count="5">
              <button type="button" role="radio" class="press fv" onClick="{{sb.pick}}" aria-checked="{{sb.checked}}" aria-label="{{sb.aria}}" style="width: 48px; height: 48px; padding: 0; border: 0; border-radius: 9999px; background: transparent; color: {{sb.color}}; display: flex; align-items: center; justify-content: center">
                <svg width="34" height="34" viewBox="0 0 24 24" fill="{{sb.fill}}" aria-hidden="true"><path d="m13.73 3.51 1.76 3.52c.24.49.88.96 1.42 1.05l3.19.53c2.04.34 2.52 1.82 1.05 3.28l-2.48 2.48c-.42.42-.65 1.23-.52 1.81l.71 3.07c.56 2.43-.73 3.37-2.88 2.1l-2.99-1.77c-.54-.32-1.43-.32-1.98 0l-2.99 1.77c-2.14 1.27-3.44.32-2.88-2.1l.71-3.07c.13-.58-.1-1.39-.52-1.81l-2.48-2.48c-1.46-1.46-.99-2.94 1.05-3.28l3.19-.53c.53-.09 1.17-.56 1.41-1.05l1.76-3.52c.96-1.91 2.52-1.91 3.47 0Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
              </button>
            </sc-for>
          </div>
          <span aria-live="polite" style="min-height: 22px; font-size: 14px; line-height: 22px; font-weight: 700">{{rateLabel}}</span>
        </div>

<script>
(function () {
  // The black icon on the launcher opens the driver app, which lives in driver/ on the same site.
  window.DRIVER_APP_URL = 'driver/';
  // ?preset=<state> opens a specific screen; the default starts on the iPhone home screen.
  var PRESETS = ["live","launcher","splash","onboarding","home-guest","home-user","search-from","search-to","date-sheet","results","no-results","gate","phone-empty","phone-error","phone-loading","otp-default","otp-wrong","otp-expired","otp-locked","profile-errors","booking","results-filter","trip-details","book-passengers","book-errors","book-luggage","book-summary","payment","payment-processing","payment-failed","payment-expired","confirmed","my-bookings","bk-current","bk-past","bk-detail-upcoming","bk-detail-enroute","bk-detail-late","bk-report","bk-report-sent","bk-cancel-select","bk-cancel-confirm","bk-cancel-done","bk-refund-failed","bk-completed","bk-rate","bk-rated","chat-open","chat-empty","chat-typing","chat-closed","push-banner","notifs","notifs-empty","home-notif","account","profile","profile-error","change-phone","change-phone-otp","settings","delete-blocked","delete-eligible","delete-confirm","support","ticket-new","ticket-detail","faq","about"];
  var q = new URLSearchParams(location.search);
  var preset = PRESETS.indexOf(q.get('preset')) !== -1 ? q.get('preset') : 'live';
  var brand = q.get('brand') === 'accessible' ? 'accessible' : 'original';
  var stage = document.getElementById('stage');
  function fit() {
    var phone = window.innerWidth < 500;
    document.body.classList.toggle('phone', phone);
    var scale = phone
      ? Math.min(window.innerWidth / 375, window.innerHeight / 812)
      : Math.min(1, (window.innerHeight - 48) / 812, (window.innerWidth - 48) / 375);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fit);
  fit();
  DCLite.mount(document.getElementById('device'), document.getElementById('app-template').content, Component, { preset: preset, brandColor: brand });
})();
</script>
