<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>تطبيق السائق · نموذج تفاعلي</title>
<link rel="icon" href="assets/app-icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
/* Scroll areas are flex columns: keep cards at their natural height instead of shrinking them. */
.app [data-scroll] > *{flex-shrink:0}
/* Tab bar from "Tab Bar - iPhone454.svg": centred glass capsule that hugs its tabs, 62px, 4px inset, active tab = #EDEDED pill. */
.tab-glass{position:absolute;left:50%;transform:translateX(-50%);bottom:20px;z-index:15;height:62px;padding:4px;border-radius:31px;display:flex;background:rgba(248,248,248,0.8);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);box-shadow:0 8px 15px rgba(0,0,0,0.04),0 0 0 0.5px #E8E8E8,inset 1.25px 0 0 rgba(208,208,208,0.55),inset -1.25px 0 0 rgba(208,208,208,0.55)}
.tab-item{flex:0 0 auto;width:76px;height:54px;padding:0;border:0;border-radius:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:background-color .2s ease,color .2s ease}
.tab-item:active{transform:scale(0.95)}
.tab-label{font-size:12px;line-height:16px;white-space:nowrap}
/* Earnings card background: light-blue base with the blurred #007AFF shape from Element.svg at full size,
   centred the way Gradient V13.svg places it, so the centre is brand blue and the edges fade to light blue. */
.earn-card{position:relative;overflow:hidden;isolation:isolate;background:#8EC5FF}
.earn-card::before{content:"";position:absolute;left:calc(50% - 527px);top:calc(50% - 593px);width:1024px;height:1292px;background:url("assets/earnings-shape-blue.svg") center/100% 100% no-repeat;z-index:-1;pointer-events:none}
/* Grain texture from the designer, over the blue and under the text and coins; drawn twice so it reads a little stronger. */
.earn-card::after{content:"";position:absolute;inset:0;background:url("assets/earnings-texture.png") center/cover no-repeat,url("assets/earnings-texture.png") center/cover no-repeat;z-index:-1;pointer-events:none}
/* Same grain texture on the dark next-trip card. */
.grain{position:relative;overflow:hidden;isolation:isolate}
.grain::after{content:"";position:absolute;inset:0;background:url("assets/earnings-texture.png") center/cover no-repeat;opacity:0.6;z-index:-1;pointer-events:none}
.earn-card.press:active:not(:disabled){transform:scale(0.98)}
.drv-hero{animation:drvPulse 2.6s ease-in-out infinite}
@keyframes drvPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0.28)}50%{box-shadow:0 0 0 18px rgba(255,255,255,0)}}
body{margin:0}
.app *{box-sizing:border-box}
.app,.app button,.app input{font-family:"thmanyah sans","IBM Plex Sans Arabic",system-ui,sans-serif}
.app button{cursor:pointer;transition:transform .12s ease,background-color .12s ease}
.app button:disabled{cursor:not-allowed}
.app input::placeholder{color:#8A8A8A}
.city-input::placeholder{font-weight:400}
.press:active:not(:disabled){transform:scale(0.97)}
.sec{width:calc(100% + 32px)!important;margin-left:-16px!important;margin-right:-16px!important;border:0!important;border-radius:0!important}
.sec.press:active:not(:disabled){transform:none;background:#F5F5F5!important}
.dark-card.press:active:not(:disabled){background:#2B2420!important}
.dark-card [style*="pointer-events: none"]{pointer-events:none}
.dark-card [style*="pointer-events: none"] button{pointer-events:auto}
.card-hit:active:not(:disabled){transform:none}
.with-nav [data-navpad]{padding-bottom:104px!important}
/* Onboarding phone: the image carries a drop shadow on one side, so the device body sits 7.6px left of the image centre; shift it back to the exact middle. */
.onb-phone{transform:translate(calc(-50% + 7.6px),0);animation:onbPhoneUp .8s cubic-bezier(.2,.8,.2,1) .15s both}
@keyframes onbPhoneUp{from{transform:translate(calc(-50% + 7.6px),180px);opacity:0}to{transform:translate(calc(-50% + 7.6px),0);opacity:1}}
.switch{position:relative;width:51px;height:31px;padding:0;border:0;border-radius:9999px;flex-shrink:0;transition:background-color .2s ease}
.switch-knob{position:absolute;top:2px;right:2px;width:27px;height:27px;border-radius:9999px;background:#FFFFFF;box-shadow:0 2px 4px rgba(18,18,18,0.2);transition:transform .2s ease}
.app-icon{box-shadow:0 4px 10px rgba(0,0,0,0.25);animation:iconHint 2.4s ease-in-out infinite}
@keyframes iconHint{0%,100%{box-shadow:0 4px 10px rgba(0,0,0,0.25),0 0 0 0 rgba(255,255,255,0.55)}50%{box-shadow:0 4px 10px rgba(0,0,0,0.25),0 0 0 8px rgba(255,255,255,0)}}
/* Rounded corners use a continuous curve (Figma corner smoothing 100%). Pills and circles
   (9999px) keep their true round shape; browsers without corner-shape fall back to plain radius. */
.app [style*="border-radius"]:not([style*="9999px"]){corner-shape:squircle}
.fv:focus-visible{outline:2px solid #007AFF;outline-offset:2px}
.field{transition:border-color .12s ease}
.field:focus-within{border-color:#007AFF!important}
.field.is-error,.field.is-error:focus-within{border-color:#FF4E64!important}
.pay-opt:focus-within{outline:2px solid #007AFF;outline-offset:2px}
.otp-input{caret-color:transparent}
/* No visible scrollbars anywhere (iOS hides them); content still scrolls. */
.app,.app *{scrollbar-width:none;-ms-overflow-style:none}
.app::-webkit-scrollbar,.app *::-webkit-scrollbar{display:none;width:0;height:0}
/* Navigation motion: a new screen slides 24px in with a quick fade; back comes from the other side; tabs just fade. */
.scr-fwd{animation:scrFwd .3s cubic-bezier(.2,.8,.2,1) both}
.scr-back{animation:scrBack .3s cubic-bezier(.2,.8,.2,1) both}
.scr-fade{animation:scrFade .2s ease-out both}
@keyframes scrFwd{from{transform:translateX(-24px);opacity:0}to{transform:none;opacity:1}}
@keyframes scrBack{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes scrFade{from{opacity:0}to{opacity:1}}
.sheet-bg{animation:scrFade .2s ease-out both}
.sheet-panel{animation:sheetUp .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.drop-in{animation:dropIn .28s cubic-bezier(.2,.8,.2,1) both}
@keyframes dropIn{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.app *{transition:none!important;animation:none!important}}
a{color:#0062CC}a:hover{color:#0051A8}
</style>
<style>
/* thmanyah sans, the design font (files in /fonts). IBM Plex Sans Arabic stays as the fallback. */
@font-face{font-family:"thmanyah sans";src:url("../fonts/thmanyahsans-Light.otf") format("opentype");font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:"thmanyah sans";src:url("../fonts/thmanyahsans-Regular.otf") format("opentype");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"thmanyah sans";src:url("../fonts/thmanyahsans-Medium.otf") format("opentype");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"thmanyah sans";src:url("../fonts/thmanyahsans-Bold.otf") format("opentype");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"thmanyah sans";src:url("../fonts/thmanyahsans-Black.otf") format("opentype");font-weight:900;font-style:normal;font-display:swap}
html,body{height:100%}
body{margin:0;background:#E9EDF3;display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{position:relative;width:375px;height:812px;flex-shrink:0;transform-origin:center center}
#device{width:375px;height:812px;overflow:hidden;border-radius:44px;background:#FFFFFF;box-shadow:0 30px 80px rgba(18,18,18,0.18),0 0 0 10px #121212}
body.phone{background:#FFFFFF}
body.phone #device{border-radius:0;box-shadow:none}
</style>

<!-- ============ SPLASH ============ -->
<sc-if value="{{isSplash}}" hint-placeholder-val="{{ false }}">

<!-- ============ PHONE (CUS-02 / CUS-03, phone-first) ============ -->
<sc-if value="{{isPhone}}" hint-placeholder-val="{{ false }}">
<form id="scr-phone" class="{{navAnim}}" onSubmit="{{submitPhone}}" novalidate="novalidate" style="flex: 1; min-height: 0; display: flex; flex-direction: column; margin: 0">
  <div style="padding: 12px 16px 0">
    
  </div>
  <div style="flex: 1; min-height: 0; overflow: auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 32px">
    <div style="display: flex; flex-direction: column; gap: 24px">

      <div style="display: flex; flex-direction: column; gap: 8px">
        <h1 style="margin: 0; font-size: 20px; line-height: 30px; font-weight: 700">أدخل رقم جوالك</h1>
        <p style="margin: 0; font-size: 14px; line-height: 22px; color: #4B4B4B">سجّل دخولك كسائق، أو أنشئ حساباً جديداً إذا كانت هذه أول مرة لك.</p>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <label for="phone" style="font-size: 14px; line-height: 22px; font-weight: 500">رقم الجوال</label>

      <button type="button" class="press fv" onClick="{{confirmReport}}" disabled="{{reportDisabled}}" style="width: 100%; height: 56px; border-radius: 9999px; border: 0; background: {{reportBg}}; color: {{reportColor}}; font-size: 16px; line-height: 24px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; flex-shrink: 0">إرسال البلاغ</button>

        <div style="display: flex; flex-direction: column; gap: 4px"><h2 id="sheet-title" style="margin: 0; font-size: 18px; line-height: 28px; font-weight: 700">تسجيل الخروج؟</h2><p style="margin: 0; font-size: 14px; line-height: 22px; color: #4B4B4B">لا يؤثر على رحلاتك أو حجوزاتك أو مستحقاتك. ستحتاج رقم جوالك ورمز التحقق للدخول مرة أخرى.</p></div>

          <button type="button" class="press fv" onClick="{{confirmLogout}}" style="height: 56px; border-radius: 9999px; border: 1px solid #BF3B4B; background: #FFFFFF; color: #BF3B4B; font-size: 16px; line-height: 24px; font-weight: 700">تسجيل الخروج</button>

<script>
(function () {
  // ?preset=<state> opens a specific screen; the default starts on the iPhone home screen.
  var PRESETS = ["live","splash","phone","phone-error","otp","otp-wrong","signup","signup-errors","docs-personal","docs-vehicle","act-review","act-rejected-edit","act-pending","act-rejected","act-approved","act-suspended","home","home-new","create-route","create-city","create-errors","create-points","create-seats","create-review","published","trips","trips-completed","trips-cancelled","trips-current-empty","trip-booked","trip-tomorrow","trip-open","trip-cancel-sheet","trip-edit","trip-completed","trip-cancelled","bookings","booking-detail","booking-partial","run-start","run-confirm","run-enroute","run-attendance","run-grace-over","run-started","run-done","chat","chat-closed","earnings","earnings-payouts","ratings","rating-report","notifs","notifs-empty","account","profile","change-phone","docs-view","docs-update","docs-pending","vehicle-view","bank","support","ticket-new","ticket","settings","terms","logout"];
  var q = new URLSearchParams(location.search);
  var preset = PRESETS.indexOf(q.get('preset')) !== -1 ? q.get('preset') : 'live';
  var brand = q.get('brand') === 'accessible' ? 'accessible' : 'original';
  var stage = document.getElementById('stage');
  function fit() {
    var phone = window.innerWidth < 500;
    document.body.classList.toggle('phone', phone);
    var scale = phone
      ? Math.min(window.innerWidth / 375, window.innerHeight / 812)
      : Math.min(1, (window.innerHeight - 48) / 812, (window.innerWidth - 48) / 375);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fit);
  fit();
  DCLite.mount(document.getElementById('device'), document.getElementById('app-template').content, Component, { preset: preset, brandColor: brand });
})();
</script>
